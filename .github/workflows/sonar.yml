name: SonarCloud Scan
on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter Maven Tag (e.g., maven-3.8.6)'
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: apache/maven
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 11 for Build
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean compile -DskipTests

      - name: Set up JDK 17 for Sonar Scan
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Analyze
        run: |
          mvn sonar:sonar -Dsonar.projectKey=MUTASIMU_maven-${{ github.event.inputs.tag }} -Dsonar.organization=mutasimu -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.exclusions=**/src/test/**,**/target/**
